<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>OpenTrack Map</title>
    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
      integrity="sha256-p4NxAoJBhIINfQPDQSuTsg8P28S4P6qnmfMcc3yDLE="
      crossorigin=""
    />
    <link rel="stylesheet" href="/styles.css" />
    <script
      defer
      src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
      integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
      crossorigin=""
    ></script>
    <script defer src="https://unpkg.com/lucide@latest"></script>
    <script defer src="/app.js"></script>
  </head>
  <body>
    <main class="app-shell">
      <aside class="panel" aria-label="Competition controls and results">
        <header class="masthead">
          <div>
            <p class="eyebrow">OpenTrack</p>
            <h1>Competition Map</h1>
          </div>
          <button class="icon-button" id="refreshButton" type="button" title="Refresh">
            <i data-lucide="refresh-cw"></i>
          </button>
        </header>

        <form class="filters" id="filters">
          <label>
            <span>Search</span>
            <input id="searchInput" name="search" type="search" placeholder="Name, venue or city" />
          </label>

          <div class="filter-grid">
            <label>
              <span>Country</span>
              <select id="countryInput" name="country">
                <option value="">Any</option>
                <option value="GBR">GBR</option>
                <option value="NOR">NOR</option>
                <option value="SAU">SAU</option>
                <option value="USA">USA</option>
                <option value="IRL">IRL</option>
                <option value="BEL">BEL</option>
                <option value="EST">EST</option>
                <option value="SRB">SRB</option>
              </select>
            </label>

            <label>
              <span>Type</span>
              <select id="typeInput" name="type">
                <option value="">Any</option>
                <option value="TRACK">Track</option>
                <option value="INDOOR">Indoor</option>
                <option value="XC">Cross country</option>
                <option value="ROAD">Road</option>
                <option value="WALK">Walk</option>
                <option value="TRAIL">Trail</option>
              </select>
            </label>
          </div>

          <div class="filter-grid">
            <label>
              <span>When</span>
              <select id="whenInput" name="when">
                <option value="future">Future</option>
                <option value="">All</option>
                <option value="past">Past</option>
              </select>
            </label>

            <label>
              <span>Limit</span>
              <select id="limitInput" name="page_size">
                <option value="50">50</option>
                <option value="100" selected>100</option>
                <option value="200">200</option>
              </select>
            </label>
          </div>

          <div class="actions">
            <button class="primary-button" type="submit">
              <i data-lucide="search"></i>
              <span>Load</span>
            </button>
            <button class="secondary-button" id="fitButton" type="button">
              <i data-lucide="scan"></i>
              <span>Fit</span>
            </button>
          </div>
        </form>

        <div class="status-row" id="status">Ready</div>
        <ol class="competition-list" id="competitionList"></ol>
      </aside>

      <section class="map-wrap" aria-label="Competition map">
        <div id="map"></div>
      </section>
    </main>
  </body>
</html>
