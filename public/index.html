<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>OpenTrack Map</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <link rel="stylesheet" href="vendor/leaflet/leaflet.css" />
    <link rel="stylesheet" href="vendor/leaflet.markercluster/MarkerCluster.css" />
    <link rel="stylesheet" href="vendor/flatpickr/flatpickr.min.css" />
    <link rel="stylesheet" href="styles.css" />
    <script defer src="vendor/leaflet/leaflet.js"></script>
    <script defer src="vendor/leaflet.markercluster/leaflet.markercluster.js"></script>
    <script defer src="vendor/flatpickr/flatpickr.min.js"></script>
    <script defer src="vendor/lucide/lucide.min.js"></script>
    <script src="config.js"></script>
    <script type="module" src="app.js"></script>
  </head>
  <body>
    <main class="app-shell">
      <aside class="panel" aria-label="Competition controls and results">
        <header class="masthead">
          <div class="masthead-main">
            <p class="eyebrow">OpenTrack</p>
            <h1>Competition Map</h1>
          </div>
          <div class="masthead-actions">
            <button
              class="icon-button"
              id="filterToggle"
              type="button"
              aria-label="Filters"
              aria-controls="filters"
              aria-expanded="false"
              title="Filters"
            >
              <i data-lucide="search"></i>
            </button>
            <button
              class="icon-button"
              id="eventsToggle"
              type="button"
              aria-label="Events"
              aria-controls="eventResults"
              aria-expanded="true"
              title="Events"
            >
              <i data-lucide="list"></i>
            </button>
            <button class="icon-button" id="refreshButton" type="button" aria-label="Refresh" title="Refresh">
              <i data-lucide="refresh-cw"></i>
            </button>
          </div>
          <div class="status-row" id="status">Ready</div>
          <div class="load-progress" id="loadProgress" hidden>
            <div class="load-progress-bar" id="loadProgressBar"></div>
          </div>
        </header>

        <form class="filters" id="filters">
          <label>
            <span>Search</span>
            <input id="searchInput" name="search" type="search" placeholder="Name, venue or city" />
          </label>

          <div class="filter-grid">
            <label>
              <span>Country</span>
              <select id="countryInput" name="country">
                <option value="GBR">Great Britain</option>
              </select>
            </label>

            <label>
              <span>Type</span>
              <select id="typeInput" name="type">
                <option value="">Any</option>
                <option value="TRACK">Track</option>
                <option value="INDOOR">Indoor</option>
                <option value="XC">Cross country</option>
                <option value="ROAD">Road</option>
                <option value="WALK">Walk</option>
                <option value="TRAIL">Trail</option>
              </select>
            </label>
          </div>

          <label>
            <span>Date range</span>
            <span class="date-field">
              <i data-lucide="calendar-days"></i>
              <input id="dateRangeInput" type="text" placeholder="Pick dates" readonly />
              <button id="clearDatesButton" class="field-icon-button" type="button" title="Clear dates">
                <i data-lucide="x"></i>
              </button>
            </span>
            <input id="dateFromInput" name="date_from" type="hidden" />
            <input id="dateToInput" name="date_to" type="hidden" />
          </label>

          <div class="actions">
            <button class="primary-button" type="submit">
              <i data-lucide="search"></i>
              <span>Load</span>
            </button>
            <button class="secondary-button" id="fitButton" type="button">
              <i data-lucide="scan"></i>
              <span>Fit</span>
            </button>
          </div>
        </form>

        <div class="event-results" id="eventResults">
          <div class="sort-row" id="sortRow" aria-label="Sort results">
            <button class="sort-toggle" data-sort-field="date" type="button">
              <span>Date</span>
              <span class="sort-indicator" aria-hidden="true"></span>
            </button>
            <button class="sort-toggle" data-sort-field="added" type="button">
              <span>Added</span>
              <span class="sort-indicator" aria-hidden="true"></span>
            </button>
            <button class="sort-toggle" data-sort-field="near" type="button">
              <span>Near me</span>
              <span class="sort-indicator" aria-hidden="true"></span>
            </button>
          </div>
          <div class="sort-hint" id="sortHint"></div>
          <ol class="competition-list" id="competitionList"></ol>
        </div>
      </aside>

      <section class="map-wrap" aria-label="Competition map">
        <div id="map"></div>
      </section>
    </main>
    <!-- Cloudflare Web Analytics -->
    <script defer src="https://static.cloudflareinsights.com/beacon.min.js" data-cf-beacon='{"token":"6e09d8695d37467982128f45c43cb531"}'></script>
    <!-- End Cloudflare Web Analytics -->
  </body>
</html>
